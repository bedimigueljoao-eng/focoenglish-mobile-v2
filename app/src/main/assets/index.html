<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>FOCOENGLISH</title><style>
:root{--navy:#07152f;--blue:#3178f6;--cyan:#26c6da;--green:#19b77b;--amber:#f59e0b;--red:#ef5350;--bg:#f4f7fc;--card:#fff;--text:#17243d;--muted:#718098;--line:#e5ebf4;--shadow:0 10px 30px #12254b12}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#07152f,#143d79);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;box-shadow:0 4px 20px #07152f35}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#4b8cff,#26c6da);font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:#bfd2ef;margin-top:2px}.page{display:none;padding:16px;animation:rise .22s ease}.page.on{display:block}@keyframes rise{from{opacity:.3;transform:translateY(6px)}}h1{font-size:25px;margin:6px 0 15px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}.hero{background:linear-gradient(145deg,#0b1e43,#2563b9 70%,#26a7bd);color:#fff;padding:21px;border-radius:24px;box-shadow:0 20px 40px #133b7830}.hero .eyebrow{color:#a9eaf3;font-size:11px;font-weight:800;letter-spacing:1.2px}.hero h1{margin:8px 0}.hero p{color:#dbe9fb;margin:8px 0 18px}.ringrow{display:flex;align-items:center;gap:16px}.ring{--p:0;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#37d7b0 calc(var(--p)*1%),#ffffff28 0)}.ring:after{content:attr(data-p)'%';display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#173f76;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:13px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}.kpi small,.muted{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:22px;margin-top:5px}.btn{border:0;background:var(--blue);color:#fff;padding:12px 15px;border-radius:13px;font-weight:750;min-height:44px}.btn:active{transform:scale(.98)}.btn.alt{background:#eaf2ff;color:#2564c8}.btn.green{background:var(--green)}.btn.red{background:#fff0f0;color:var(--red)}.btn.dark{background:var(--navy)}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{border:0;background:#fff;padding:13px 4px;border-radius:16px;color:var(--text);box-shadow:var(--shadow);font-size:11px}.quick span{display:block;font-size:22px;margin-bottom:5px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 5px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #12254b12}.bottom button{flex:1;border:0;background:none;padding:7px 2px;color:#8390a5;font-size:10px}.bottom button.on{color:var(--blue);font-weight:800}.bottom span{display:block;font-size:21px;margin-bottom:2px}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.grow{flex:1;min-width:0}.dot{width:12px;height:12px;border:3px solid #ccd6e5;border-radius:50%;flex:none}.dot.done{background:var(--green);border-color:var(--green)}.dot.active{background:var(--blue);border-color:#b9d3ff}.pill,.tag{display:inline-flex;align-items:center;background:#edf4ff;color:#2867c7;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700}.tag.green{background:#e9fbf4;color:#14865d}.progress{height:8px;background:#eaf0f7;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:20px}.level-tabs,.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:999px;white-space:nowrap}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.timer{font-size:49px;font-weight:850;text-align:center;letter-spacing:1px;margin:22px 0}.timer-orb{background:linear-gradient(160deg,#eef5ff,#fff);border:1px solid #dbe8fb;border-radius:28px;padding:21px}.form label{display:block;color:#58677e;font-size:12px;font-weight:750;margin:12px 0}.form input,.form select,.form textarea{width:100%;padding:13px;border:1px solid #dbe3ef;border-radius:12px;background:#fbfdff;margin-top:6px;color:var(--text);outline:none}.form textarea{min-height:108px;resize:vertical}.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3178f619}.modal{position:fixed;inset:0;background:#07152fb5;display:grid;place-items:end center;z-index:50}.modal.hide{display:none}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0}.handle{width:45px;height:5px;background:#dce3ee;border-radius:20px;margin:-8px auto 18px}.notice{position:fixed;left:16px;right:16px;bottom:90px;background:#07152f;color:#fff;padding:13px 15px;border-radius:13px;z-index:80;box-shadow:0 12px 30px #0003}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty span{display:block;font-size:36px;margin-bottom:8px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;margin-bottom:12px}.map-node{position:relative;padding-left:28px}.map-node:before{content:'';position:absolute;left:5px;top:0;bottom:0;width:3px;background:#e2e9f4}.map-node .card{position:relative}.map-node .card:before{content:'';position:absolute;left:-35px;top:22px;width:15px;height:15px;border-radius:50%;background:var(--blue);border:4px solid #dbe9ff}.statbar{display:grid;grid-template-columns:110px 1fr 55px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.statbar i{display:block;height:8px;border-radius:20px;background:linear-gradient(90deg,#3178f6,#26c6da)}.fab{position:fixed;right:18px;bottom:92px;width:56px;height:56px;border:0;border-radius:18px;background:var(--blue);color:#fff;font-size:28px;box-shadow:0 10px 25px #3178f655;z-index:15}@media(min-width:720px){body{max-width:720px;margin:auto}.bottom{max-width:720px;margin:auto}.modal{place-items:center}.sheet{max-width:680px;border-radius:26px}.fab{right:calc(50% - 340px)}}</style></head><body>
<header class="top"><div class="brand"><div class="logo">FE</div><div><b>FOCOENGLISH</b><small id="subtitle">A tua jornada até ao C2</small></div></div></header>
<main><section id="home" class="page on"></section><section id="map" class="page"></section><section id="study" class="page"></section><section id="library" class="page"></section><section id="more" class="page"></section><section id="detail" class="page"></section></main>
<nav class="bottom"><button data-p="home" class="on"><span>⌂</span>Início</button><button data-p="map"><span>◈</span>Mapa</button><button data-p="study"><span>◷</span>Estudar</button><button data-p="library"><span>▤</span>Biblioteca</button><button data-p="more"><span>•••</span>Mais</button></nav><div id="modal" class="modal hide"><div class="sheet"><div class="handle"></div><div id="sheet"></div></div></div><script>
let CUR=[],currentId=1,currentLib='topics',mapLevel='A1';const K='foco_mobile_data_v2',OLD='foco_mobile_data_v1',CK='foco_mobile_clock_v2';const ACTIVITIES=['Listening ativo','Listening passivo','Speaking','Reading','Writing','Grammar','Vocabulary','Pronunciation','Filmes e séries','Aula externa','Outra atividade'];const $=x=>document.getElementById(x);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const today=()=>new Date().toISOString().slice(0,10);function blank(){return{version:2,lessons:{},sessions:[],materials:[],exams:[],customTopics:[],phrases:[],movies:[],pdfs:[],goals:{daily:60,weekly:300},settings:{name:'Bedi'}}}
function migrate(){if(localStorage.getItem(K))return;let n=blank();try{let o=JSON.parse(localStorage.getItem(OLD)||'{}');Object.assign(n,{lessons:o.lessons||{},sessions:(o.sessions||[]).map(s=>({...s,activity:(s.source||'').replace('Manual - ','')||'Estudo geral'})),materials:o.materials||[],exams:o.exams||[]})}catch(e){}save(n)}
function data(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return blank()}}
function save(d){localStorage.setItem(K,JSON.stringify(d))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function note(t){let n=document.createElement('div');n.className='notice';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
function st(id){return data().lessons[id]||{status:'Não iniciado',completed:false,attempts:1}}
function mins(){return data().sessions.reduce((a,x)=>a+(+x.minutes||0),0)}
function hoursFor(id){return data().sessions.filter(x=>String(x.lessonId)===String(id)).reduce((a,x)=>a+(+x.minutes||0),0)/60}
function nav(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.p===id));window.scrollTo(0,0);({home:renderHome,map:renderMap,study:renderStudy,library:renderLibrary,more:renderMore}[id]||(()=>{}))()}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>nav(b.dataset.p));function current(){return CUR.find(x=>!st(x.id).completed)||CUR[CUR.length-1]}
function streak(){let ds=[...new Set(data().sessions.map(x=>x.date))].sort().reverse(),n=0,d=new Date();for(;;){let s=d.toISOString().slice(0,10);if(ds.includes(s)){n++;d.setDate(d.getDate()-1)}else if(s===today()){d.setDate(d.getDate()-1)}else break}return n}
function renderHome(){let d=data(),c=current(),done=CUR.filter(x=>st(x.id).completed).length,p=Math.round(done/CUR.length*100),tm=d.sessions.filter(x=>x.date===today()).reduce((a,x)=>a+x.minutes,0),goal=d.goals.daily||60;$('subtitle').textContent='A tua jornada até ao C2';$('home').innerHTML=`<div class="hero"><div class="eyebrow">CONTINUA A EVOLUIR</div><h1>Olá, ${esc(d.settings.name||'Bedi')} 👋</h1><div class="ringrow"><div class="ring" style="--p:${p}" data-p="${p}"></div><div><b>${esc(c.level)} · ${esc(c.title)}</b><p>${done} de ${CUR.length} temas concluídos</p></div></div><button class="btn green" onclick="openTopic(${c.id})">Continuar aprendizagem</button></div><div class="grid"><div class="card kpi"><small>Hoje</small><b>${tm} min</b><div class="progress"><i style="width:${Math.min(100,tm/goal*100)}%"></i></div></div><div class="card kpi"><small>Sequência</small><b>${streak()} dias</b><span class="muted">Mantém o ritmo</span></div><div class="card kpi"><small>Total</small><b>${(mins()/60).toFixed(1)}h</b></div><div class="card kpi"><small>Nível atual</small><b>${esc(c.level)}</b></div></div><h2>Acesso rápido</h2><div class="quick"><button onclick="nav('study')"><span>⏱</span>Cronómetro</button><button onclick="currentLib='phrases';nav('library')"><span>💬</span>Frases</button><button onclick="currentLib='movies';nav('library')"><span>🎬</span>Filmes</button><button onclick="currentLib='pdfs';nav('library')"><span>📄</span>PDFs</button></div><div class="card" style="margin-top:13px"><h3>Meta diária</h3><div class="row"><div class="grow"><b>${tm} de ${goal} minutos</b><div class="muted">${tm>=goal?'Meta cumprida. Excelente trabalho!':'Faltam '+Math.max(0,goal-tm)+' minutos.'}</div></div><button class="btn alt" onclick="editGoals()">Editar</button></div></div>`}
function renderMap(){let lvls=['A1','A2','B1','B2','C1','C2'];$('map').innerHTML=`<h1>Mapa de aprendizagem</h1><p class="muted">Segue o percurso recomendado ou abre livremente qualquer tema.</p><div class="level-tabs">${lvls.map(l=>`<button class="chip ${mapLevel===l?'on':''}" onclick="mapLevel='${l}';renderMap()">${l}</button>`).join('')}</div><div class="map-node">${CUR.filter(x=>x.level===mapLevel).map(x=>{let q=st(x.id);return`<div class="card" onclick="openTopic(${x.id})"><span class="tag ${q.completed?'green':''}">${esc(x.module)}</span><h3 style="margin-top:10px">${esc(x.title)}</h3><div class="muted">${esc(q.status)} · ${hoursFor(x.id).toFixed(1)}h</div></div>`}).join('')}</div>`}
function openTopic(id){currentId=id;let x=CUR.find(y=>y.id===id),q=st(id),ms=data().materials.filter(m=>String(m.lessonId)===String(id));$('detail').innerHTML=`<button class="chip" onclick="nav('map')">‹ Voltar</button><div style="margin-top:14px"><span class="tag">${x.level} · ${esc(x.module)}</span><h1>${esc(x.title)}</h1><div class="card"><h3>Objetivo</h3><p>${esc(x.objective)}</p><h3>Conteúdos</h3><p>${esc(x.topics)}</p><h3>Situação real</h3><p>${esc(x.situation)}</p><h3>Missão prática</h3><p>${esc(x.speaking)}</p><div class="actions"><button class="btn" onclick="prepareStudy('standard',${id})">Estudar</button><button class="btn alt" onclick="manual(${id})">Adicionar tempo</button><button class="btn green" onclick="complete(${id})">${q.completed?'Concluído ✓':'Concluir'}</button><button class="btn alt" onclick="repeatTopic(${id})">Repetir</button></div></div><div class="card"><h3>Materiais</h3>${ms.length?ms.map(m=>`<div class="row"><div class="grow"><b>${esc(m.title)}</b><div class="muted">${esc(m.type)}</div></div><button class="btn alt" onclick="openExternal('${esc(m.url)}')">Abrir</button></div>`).join(''):'<div class="empty">Nenhum material associado.</div>'}<button class="btn alt full" onclick="addLink(${id})">+ Adicionar link</button></div></div>`;nav('detail')}
function clock(){return JSON.parse(localStorage.getItem(CK)||'{"targetType":"standard","targetId":null,"activity":"Listening ativo","base":0,"started":null,"running":false}')}
function setClock(c){localStorage.setItem(CK,JSON.stringify(c))}
function seconds(){let c=clock();return c.base+(c.running?Math.floor((Date.now()-c.started)/1000):0)}
function fmt(s){return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function targetName(c){if(c.targetType==='custom'){let x=data().customTopics.find(x=>x.id===c.targetId);return x?x.title:'Tema pessoal'}let x=CUR.find(x=>x.id===+c.targetId);return x?x.title:'Estudo livre'}
function renderStudy(){let c=clock();$('study').innerHTML=`<h1>Sessão de estudo</h1><div class="timer-orb"><div style="text-align:center"><span class="tag">${esc(c.activity)}</span><h2 style="margin-top:13px">${esc(targetName(c))}</h2></div><div id="tm" class="timer">${fmt(seconds())}</div><div class="actions" style="justify-content:center"><button class="btn" onclick="startClock()">${c.running?'A decorrer':'Iniciar / Continuar'}</button><button class="btn alt" onclick="pauseClock()">Pausar</button><button class="btn green" onclick="finishClock()">Guardar</button><button class="btn red" onclick="resetClock()">Reiniciar</button></div></div><div class="card"><h3>Configurar sessão</h3><label class="muted">Competência</label><select class="search" onchange="changeActivity(this.value)">${ACTIVITIES.map(a=>`<option ${a===c.activity?'selected':''}>${a}</option>`).join('')}</select><button class="btn alt full" onclick="chooseTarget()">Alterar tema associado</button></div>`}setInterval(()=>{if($('tm'))$('tm').textContent=fmt(seconds())},500);function startClock(){let c=clock();if(!c.running){c.started=Date.now();c.running=true;setClock(c);renderStudy()}}
function pauseClock(){let c=clock();if(c.running){c.base=seconds();c.running=false;c.started=null;setClock(c);renderStudy()}}
function resetClock(){if(confirm('Apagar o tempo não guardado?')){let c=clock();setClock({...c,base:0,started:null,running:false});renderStudy()}}
function changeActivity(v){let c=clock();c.activity=v;setClock(c)}
function prepareStudy(type,id){let c=clock();if(seconds()>0&&!confirm('Existe uma sessão por guardar. Alterar o tema?'))return;c.targetType=type;c.targetId=id;c.base=0;c.started=null;c.running=false;setClock(c);nav('study')}
function chooseTarget(){let d=data();sheet(`<h2>Associar sessão</h2><button class="btn alt full" onclick="prepareStudy('standard',${current().id});closeSheet()">Tema atual: ${esc(current().title)}</button><div style="height:8px"></div><select id="ct" class="search">${CUR.map(x=>`<option value="${x.id}">${x.level} · ${esc(x.title)}</option>`).join('')}</select><button class="btn full" onclick="prepareStudy('standard',+ct.value);closeSheet()">Selecionar tema padrão</button>${d.customTopics.length?`<div style="height:12px"></div><select id="cc" class="search">${d.customTopics.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select><button class="btn dark full" onclick="prepareStudy('custom',cc.value);closeSheet()">Selecionar tema pessoal</button>`:''}`)}
function finishClock(){pauseClock();let c=clock();if(c.base<1)return note('Inicia o cronómetro.');sheet(`<h2>Guardar sessão</h2><p><b>${esc(c.activity)}</b> · ${fmt(c.base)}</p><div class="form"><label>O que aprendeste?<textarea id="fn" placeholder="Resumo, dificuldades, palavras novas..."></textarea></label></div><div class="actions"><button class="btn green" onclick="saveFinished()">Guardar</button><button class="btn alt" onclick="closeSheet()">Cancelar</button></div>`)}
function saveFinished(){let c=clock(),d=data();d.sessions.push({id:uid(),lessonId:c.targetType==='standard'?+c.targetId:null,customTopicId:c.targetType==='custom'?c.targetId:null,minutes:Math.max(1,Math.ceil(c.base/60)),activity:c.activity,source:'Cronómetro',notes:fn.value,date:today()});if(c.targetType==='standard'&&c.targetId){let q=st(c.targetId);q.status=q.completed?'Concluído':'Em andamento';d.lessons[c.targetId]=q}save(d);setClock({...c,base:0,started:null,running:false});closeSheet();renderStudy();note('Sessão guardada.')}
function addSession(id,minutes,activity,notes,date){let d=data();d.sessions.push({id:uid(),lessonId:id,minutes,activity,source:'Manual',notes,date:date||today()});if(id){let q=st(id);q.status=q.completed?'Concluído':'Em andamento';d.lessons[id]=q}save(d)}
function renderLibrary(){
 let tabs=[['topics','Meus temas'],['phrases','Frases'],['movies','Filmes'],['pdfs','PDFs']],d=data();
 $('library').innerHTML=`<h1>Biblioteca</h1><div class="filters">${tabs.map(x=>`<button class="chip ${currentLib===x[0]?'on':''}" onclick="currentLib='${x[0]}';renderLibrary()">${x[1]}</button>`).join('')}</div><div id="libbody"></div><button class="fab" onclick="addLibrary()">+</button>`;
 let b=$('libbody'),out='';
 if(currentLib==='topics') out=d.customTopics.map(x=>`<div class="card"><span class="tag">${esc(x.level||'Livre')} · ${esc(x.category||'Geral')}</span><h3 style="margin-top:10px">${esc(x.title)}</h3><p class="muted">${esc((x.text||'').slice(0,140))}</p><div class="actions"><button class="btn" onclick="prepareStudy('custom','${x.id}')">Estudar</button><button class="btn alt" onclick="viewCustom('${x.id}')">Abrir</button><button class="btn red" onclick="removeItem('customTopics','${x.id}')">Eliminar</button></div></div>`).join('')||empty('📝','Ainda não criaste temas pessoais.');
 if(currentLib==='phrases') out=d.phrases.slice().reverse().map(x=>`<div class="card"><h3>${esc(x.english)}</h3><p>${esc(x.translation)}</p><div class="muted">${esc(x.source||'Sem fonte')} ${x.favorite?'· ★ Favorita':''}</div><div class="actions" style="margin-top:10px"><button class="btn alt" onclick="toggleFav('${x.id}')">${x.favorite?'Remover favorito':'Favoritar'}</button><button class="btn red" onclick="removeItem('phrases','${x.id}')">Eliminar</button></div></div>`).join('')||empty('💬','Guarda aqui frases e perguntas marcantes.');
 if(currentLib==='movies') out=d.movies.slice().reverse().map(x=>`<div class="card"><span class="tag">${esc(x.type)} · ${esc(x.status)}</span><h3 style="margin-top:10px">${esc(x.title)}</h3><div class="muted">${esc(x.subtitles)} · compreensão ${esc(x.comprehension||0)}% · ${esc(x.minutes||0)} min</div><p>${esc(x.notes||'')}</p><button class="btn red" onclick="removeItem('movies','${x.id}')">Eliminar</button></div>`).join('')||empty('🎬','Regista filmes e séries assistidos em inglês.');
 if(currentLib==='pdfs') out=d.pdfs.slice().reverse().map(x=>`<div class="card"><span class="tag">${esc(x.status||'Por ler')}</span><h3 style="margin-top:10px">${esc(x.title)}</h3><div class="muted">${esc(x.level||'Livre')} · ${esc(x.category||'Geral')}</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="openPdf('${x.fileId}')">Abrir PDF</button><button class="btn red" onclick="removeItem('pdfs','${x.id}')">Eliminar registo</button></div></div>`).join('')||empty('📄','Importa PDFs para a biblioteca da aplicação.');
 b.innerHTML=out;
}
function empty(icon,text){return`<div class="card empty"><span>${icon}</span>${text}</div>`}
function addLibrary(){({topics:addCustom,phrases:addPhrase,movies:addMovie,pdfs:addPdf}[currentLib])()}
function sheet(x){$('sheet').innerHTML=x;$('modal').classList.remove('hide')}
function closeSheet(){$('modal').classList.add('hide')}
function addCustom(){sheet(`<h2>Novo tema pessoal</h2><div class="form"><label>Título<input id="xt"></label><label>Nível<select id="xl"><option>Livre</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></label><label>Categoria<input id="xc" placeholder="Carreira, viagens, tecnologia..."></label><label>Texto ou matéria<textarea id="xx"></textarea></label><label>Resumo pessoal<textarea id="xr"></textarea></label><label>Estado<select id="xs"><option>Não iniciado</option><option>Em estudo</option><option>Em revisão</option><option>Dominado</option></select></label></div><button class="btn full" onclick="saveCustom()">Guardar tema</button>`)}
function saveCustom(){if(!xt.value.trim())return note('Indica o título.');let d=data();d.customTopics.push({id:uid(),title:xt.value.trim(),level:xl.value,category:xc.value,text:xx.value,summary:xr.value,status:xs.value,created:today()});save(d);closeSheet();renderLibrary();note('Tema criado.')}
function viewCustom(id){let x=data().customTopics.find(x=>x.id===id);sheet(`<span class="tag">${esc(x.level)} · ${esc(x.category)}</span><h2 style="margin-top:12px">${esc(x.title)}</h2><p>${esc(x.text).replace(/\n/g,'<br>')}</p><h3>Resumo</h3><p>${esc(x.summary).replace(/\n/g,'<br>')}</p><button class="btn" onclick="prepareStudy('custom','${id}');closeSheet()">Estudar este tema</button>`)}
function addPhrase(){sheet(`<h2>Nova frase ou pergunta</h2><div class="form"><label>Em inglês<textarea id="pe"></textarea></label><label>Tradução<textarea id="pt"></textarea></label><label>Contexto<input id="pc"></label><label>Fonte<select id="ps"><option>Filme ou série</option><option>PDF</option><option>Livro</option><option>Aula</option><option>Vídeo</option><option>Conversa</option><option>Tema de estudo</option><option>Outra</option></select></label><label><input id="pf" type="checkbox" style="width:auto"> Marcar como favorita</label></div><button class="btn full" onclick="savePhrase()">Guardar frase</button>`)}
function savePhrase(){if(!pe.value.trim())return note('Escreve a frase.');let d=data();d.phrases.push({id:uid(),english:pe.value,translation:pt.value,context:pc.value,source:ps.value,favorite:pf.checked,created:today()});save(d);closeSheet();renderLibrary()}
function toggleFav(id){let d=data(),x=d.phrases.find(x=>x.id===id);x.favorite=!x.favorite;save(d);renderLibrary()}
function addMovie(){sheet(`<h2>Filme ou série</h2><div class="form"><label>Nome<input id="mt"></label><label>Tipo<select id="my"><option>Filme</option><option>Série</option></select></label><label>Temporada / episódio<input id="me"></label><label>Estado<select id="ms"><option>Quero assistir</option><option>A assistir</option><option>Concluído</option></select></label><label>Legenda<select id="ml"><option>Em português</option><option>Em inglês</option><option>Sem legenda</option></select></label><label>Minutos assistidos<input id="mm" type="number" min="0"></label><label>Compreensão (%)<input id="mc" type="number" min="0" max="100"></label><label>Resumo, palavras e observações<textarea id="mn"></textarea></label></div><button class="btn full" onclick="saveMovie()">Guardar</button>`)}
function saveMovie(){if(!mt.value.trim())return note('Indica o nome.');let d=data(),v={id:uid(),title:mt.value,type:my.value,episode:me.value,status:ms.value,subtitles:ml.value,minutes:+mm.value||0,comprehension:+mc.value||0,notes:mn.value,date:today()};d.movies.push(v);if(v.minutes)d.sessions.push({id:uid(),lessonId:null,minutes:v.minutes,activity:'Filmes e séries',source:v.title,notes:v.notes,date:today()});save(d);closeSheet();renderLibrary();note('Registo guardado.')}
function addPdf(){if(window.Android&&Android.choosePdf)Android.choosePdf();else note('A importação funciona dentro da aplicação Android.')}
window.onPdfImported=function(fileId,fileName){sheet(`<h2>PDF importado</h2><div class="form"><label>Título<input id="pdt" value="${esc(fileName.replace(/\.pdf$/i,''))}"></label><label>Nível<select id="pdl"><option>Livre</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></label><label>Categoria<input id="pdc" placeholder="Gramática, leitura..."></label><label>Estado<select id="pds"><option>Por ler</option><option>Em leitura</option><option>Concluído</option></select></label></div><button class="btn full" onclick="savePdf('${esc(fileId)}','${esc(fileName)}')">Adicionar à biblioteca</button>`)}
function savePdf(fid,name){let d=data();d.pdfs.push({id:uid(),fileId:fid,fileName:name,title:pdt.value||name,level:pdl.value,category:pdc.value,status:pds.value,created:today()});save(d);closeSheet();renderLibrary()}
function openPdf(id){if(window.Android&&Android.openPdf)Android.openPdf(id);else note('Disponível no Android.')}
function removeItem(key,id){if(!confirm('Eliminar este registo?'))return;let d=data();d[key]=d[key].filter(x=>x.id!==id);save(d);renderLibrary()}
function renderMore(){let d=data(),week=d.sessions.filter(x=>(new Date()-new Date(x.date+'T00:00:00'))/86400000<7),by={};d.sessions.forEach(x=>by[x.activity||'Estudo geral']=(by[x.activity||'Estudo geral']||0)+x.minutes);let mx=Math.max(1,...Object.values(by));$('more').innerHTML=`<h1>Progresso e opções</h1><div class="card"><h2>Estatísticas</h2><div class="grid"><div class="kpi"><small>Esta semana</small><b>${Math.round(week.reduce((a,x)=>a+x.minutes,0)/60*10)/10}h</b></div><div class="kpi"><small>Sessões</small><b>${d.sessions.length}</b></div></div>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="statbar"><span>${esc(k)}</span><div><i style="width:${v/mx*100}%"></i></div><b>${Math.round(v/60*10)/10}h</b></div>`).join('')||'<p class="muted">As estatísticas aparecerão após a primeira sessão.</p>'}</div><div class="card"><h2>Histórico recente</h2>${d.sessions.slice(-8).reverse().map(s=>`<div class="row"><div class="grow"><b>${esc(s.activity||'Estudo')}</b><div class="muted">${esc(s.date)} · ${esc(s.source||'')} ${s.notes?'· '+esc(s.notes):''}</div></div><b>${s.minutes} min</b></div>`).join('')||'<p class="muted">Nenhuma sessão registada.</p>'}</div><div class="card"><h2>Testes de nível</h2><div class="actions">${['A1','A2','B1','B2','C1','C2'].map(l=>`<button class="btn alt" onclick="exam('${l}')">${l}</button>`).join('')}</div></div><div class="card"><h2>Cópia de segurança</h2><p class="muted">Inclui progresso, sessões, temas pessoais, frases, filmes e registos de PDFs.</p><div class="actions"><button class="btn" onclick="exportBackup()">Exportar</button><button class="btn alt" onclick="chooseBackup()">Importar</button></div></div><div class="card"><h2>Sobre</h2><p>FOCOENGLISH Mobile V2.0</p><p class="muted">Aplicação offline, desenvolvida para estudo pessoal em telefone.</p></div>`}
function editGoals(){let d=data();sheet(`<h2>Metas de estudo</h2><div class="form"><label>Meta diária em minutos<input id="gd" type="number" value="${d.goals.daily}"></label><label>Meta semanal em minutos<input id="gw" type="number" value="${d.goals.weekly}"></label></div><button class="btn full" onclick="saveGoals()">Guardar metas</button>`)}
function saveGoals(){let d=data();d.goals={daily:Math.max(1,+gd.value||60),weekly:Math.max(1,+gw.value||300)};save(d);closeSheet();renderHome()}
function exam(l){let v=prompt('Nota do teste '+l+' (0 a 100)');if(v===null)return;let d=data();d.exams.push({id:uid(),level:l,score:Math.max(0,Math.min(100,+v||0)),date:today()});save(d);note('Nota guardada.')}
function complete(id){let d=data(),q=st(id);q.completed=true;q.status='Concluído';d.lessons[id]=q;save(d);openTopic(id)}
function repeatTopic(id){let d=data(),q=st(id);q.completed=false;q.status='A repetir';q.attempts=(q.attempts||1)+1;d.lessons[id]=q;save(d);openTopic(id)}
function manual(id){sheet(`<h2>Adicionar tempo</h2><div class="form"><label>Data<input id="md" type="date" value="${today()}"></label><label>Horas<input id="mh" type="number" min="0" value="0"></label><label>Minutos<input id="mmn" type="number" min="0" max="59" value="30"></label><label>Atividade<select id="ma">${ACTIVITIES.map(a=>`<option>${a}</option>`).join('')}</select></label><label>Observações<textarea id="mno"></textarea></label></div><button class="btn full" onclick="saveManual(${id})">Guardar</button>`)}
function saveManual(id){let m=(+mh.value||0)*60+(+mmn.value||0);if(m<1)return note('Indica o tempo.');addSession(id,m,ma.value,mno.value,md.value);closeSheet();note('Tempo guardado.')}
function addLink(id){sheet(`<h2>Adicionar material</h2><div class="form"><label>Título<input id="lt"></label><label>Tipo<select id="ltype"><option>YouTube</option><option>Website</option><option>Documento externo</option></select></label><label>Link<input id="lu" type="url" placeholder="https://..."></label></div><button class="btn full" onclick="saveLink(${id})">Guardar</button>`)}
function saveLink(id){if(!/^https?:\/\//i.test(lu.value))return note('Indica um link válido.');let d=data();d.materials.push({id:uid(),lessonId:id,title:lt.value||'Material',type:ltype.value,url:lu.value});save(d);closeSheet();openTopic(id)}
function openExternal(url){if(window.Android&&Android.openUrl)Android.openUrl(url);else location.href=url}
function exportBackup(){let t=JSON.stringify(data(),null,2);if(window.Android&&Android.exportBackup)Android.exportBackup(t);else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='focoenglish_backup_v2.json';a.click()}}
function chooseBackup(){if(window.Android&&Android.chooseBackup)Android.chooseBackup();else note('Disponível no Android.')}window.importBackup=function(text){try{let inc=JSON.parse(text),d=data();for(let key of ['sessions','materials','exams','customTopics','phrases','movies','pdfs']){let ids=new Set((d[key]||[]).map(x=>x.id));for(let x of inc[key]||[])if(!ids.has(x.id))d[key].push(x)}d.lessons={...d.lessons,...(inc.lessons||{})};d.goals=inc.goals||d.goals;save(d);renderHome();note('Backup importado.')}catch(e){note('Backup inválido.')}};migrate();fetch('curriculum.json').then(r=>r.json()).then(x=>{CUR=x;currentId=current().id;renderHome();renderMap();renderStudy();renderLibrary();renderMore()}).catch(()=>note('Não foi possível carregar o currículo.'));</script></body></html>
